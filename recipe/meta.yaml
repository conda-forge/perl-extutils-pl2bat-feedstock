{% set name = "perl-extutils-pl2bat" %}
{% set version = "0.005" %}
{% set sha256 = "4940f98da2d341d3604393b1a7007c2fc968f89aed3392c90b574453010f9244" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://cpan.metacpan.org/authors/id/L/LE/LEONT/ExtUtils-PL2Bat-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 1
  run_exports:
    weak:
      - {{ name }} ={{ version }}

requirements:
  build:
    - make
  host:
    - perl
  run:
    - perl

test:
  imports:
    - ExtUtils::PL2Bat

about:
  home: https://metacpan.org/pod/ExtUtils::PL2Bat
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_file:
    - {{ environ["PREFIX"] }}/lib/perl5/core_perl/pod/perlartistic.pod
    - {{ environ["PREFIX"] }}/lib/perl5/core_perl/pod/perlgpl.pod
  summary: 'Batch file creation to run perl scripts on Windows'

extra:
  recipe-maintainers:
    - xileF1337
    - cbrueffer
